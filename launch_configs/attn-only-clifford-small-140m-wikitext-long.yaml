# AttnOnlyCliffordLM (Clifford attention + standard MLP, with DEQ).
# Same training recipe as clifford-small-140m-wikitext-long.yaml and
# attractor-small-140m-wikitext-long.yaml — only model_overwrite differs:
#   clifford_attention=True, clifford_mlp=False
# This isolates the contribution of Clifford attention to LM quality
# under DEQ training.
#
# Run with:
#   set WANDB_MODE=disabled
#   set LOCAL_WORLD_SIZE=1
#   set HF_HUB_OFFLINE=1
#   python scripts/train.py --config launch_configs/attn-only-clifford-small-140m-wikitext-long.yaml

run_name: attn-only-clifford-small-140m-wikitext-long
resume: False
max_tokens: 0
max_steps: 500
seed: 42
out_dir: "D:/code/gattrlm/runs/attn-only-clifford-small-140m-wikitext-long"
model_name: clifford-small-140m
model_impl: dynamic
block_size: 512

partial_depth_eval: []

model_overwrite:
  vocab_size: 32768
  block_size: 512
  max_iter: 16
  min_iter: 4
  backward_max_iter: 16
  backward_min_iter: 4
  # The two flags that pick the FP block flavor.
  clifford_attention: True
  clifford_mlp: False
  # Clifford-attention sub-config. With n_embd=1024 and 8 heads of 16 channels
  # each, lift dim = 8*16*8 = 1024 (matches n_embd, parity with std attention).
  n_clifford_attn_heads: 8
  n_clifford_attn_channels_per_head: 16

world_batch_size: 8
micro_batch_size: 8

optimizer: MuonAdamW
optim_config:
  lr: 4e-3
  weight_decay: 0.0
  betas: [0.8, 0.95]
  eps: 1e-10
  muon_lr: 4e-3
  muon_momentum: 0.95
  muon_wd: 0.2
  muon_ns_steps: 5

warmup_steps: 0.05
cooldown_steps: 0.2
lr_schedule: trapezoid
min_lr: 0
grad_clip: 1.0
no_weight_decay_for_bias_and_norm_params: True

z_regularization: 0
label_smoothing: 0

fabric_strategy: single
fabric_precision: bf16-mixed
fabric:
  optim_sharding: False

compile_model: False
gradient_checkpointing: False

loss_guardrail_active: True
skip_nonfinite_grads: True
allow_nonfinite_loss: False

logger_name: wandb
logger_project: clifford-local
model_telemetry: True
log_step_interval: 20
save_step_interval: 500
eval_step_interval: 250
eval_iters: 8
save_last_step: True

all_block_size_tensors: False
pack_sequences: True

data_config:
  train_data:
    - type: pqds-pure
      prefix: "train"
      weight: 1
      data_dir: "D:/hf_cache/huggingface/hub/datasets--Salesforce--wikitext/snapshots/b08601e04326c79dfdd32d625aee71d232d685c3/wikitext-103-v1"
      data_signature:
        keys: ["text"]
  val_data:
    - type: pqds-pure
      prefix: "validation"
      weight: 1
      data_dir: "D:/hf_cache/huggingface/hub/datasets--Salesforce--wikitext/snapshots/b08601e04326c79dfdd32d625aee71d232d685c3/wikitext-103-v1"
      data_signature:
        keys: ["text"]

tokenizer_path: "SandyResearch/parcae-tokenizer"
