# Single-GPU recipe backed by the locally cached wikitext-103 corpus.
# Uses the Salesforce/wikitext-103-v1 parquet shards already on disk under
# the HF cache, plus the cached SandyResearch/parcae-tokenizer.
#
# Run with:
#   set WANDB_MODE=disabled
#   set LOCAL_WORLD_SIZE=1
#   set HF_HUB_OFFLINE=1
#   python scripts/train.py --config launch_configs/clifford-small-140m-wikitext.yaml

run_name: clifford-small-140m-wikitext
resume: False
max_tokens: 0
max_steps: 40
seed: 42
out_dir: "D:/code/gattrlm/runs/clifford-small-140m-wikitext"
model_name: clifford-small-140m
model_impl: dynamic
block_size: 256

partial_depth_eval: []

model_overwrite:
  vocab_size: 32768
  block_size: 256
  max_iter: 16
  min_iter: 4
  backward_max_iter: 16
  backward_min_iter: 4

world_batch_size: 4
micro_batch_size: 4

optimizer: MuonAdamW
optim_config:
  lr: 8e-3
  weight_decay: 0.0
  betas: [0.8, 0.95]
  eps: 1e-10
  muon_lr: 8e-3
  muon_momentum: 0.95
  muon_wd: 0.2
  muon_ns_steps: 5

warmup_steps: 0.0
cooldown_steps: 0.5
lr_schedule: trapezoid
min_lr: 0
grad_clip: 1.0
no_weight_decay_for_bias_and_norm_params: True

z_regularization: 0
label_smoothing: 0

fabric_strategy: single
fabric_precision: bf16-mixed
fabric:
  optim_sharding: False

compile_model: False
gradient_checkpointing: False

loss_guardrail_active: True
skip_nonfinite_grads: True
allow_nonfinite_loss: False

logger_name: wandb
logger_project: clifford-local
model_telemetry: True
log_step_interval: 1
save_step_interval: 1024
eval_step_interval: 1024
eval_iters: 4
save_last_step: False

all_block_size_tensors: False
pack_sequences: True

data_config:
  train_data:
    - type: pqds-pure
      prefix: "train"
      weight: 1
      data_dir: "D:/hf_cache/huggingface/hub/datasets--Salesforce--wikitext/snapshots/b08601e04326c79dfdd32d625aee71d232d685c3/wikitext-103-v1"
      data_signature:
        keys: ["text"]
  val_data:
    - type: pqds-pure
      prefix: "validation"
      weight: 1
      data_dir: "D:/hf_cache/huggingface/hub/datasets--Salesforce--wikitext/snapshots/b08601e04326c79dfdd32d625aee71d232d685c3/wikitext-103-v1"
      data_signature:
        keys: ["text"]

tokenizer_path: "SandyResearch/parcae-tokenizer"
